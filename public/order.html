<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your order — Watch Store Lab</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>⌚</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="site-header__inner">
      <a class="wordmark" href="/">
        <span class="wordmark__dial">⌚</span>
        <span class="wordmark__text">
          Watch Store
          <span class="wordmark__tag">Lab</span>
        </span>
      </a>
      <nav class="site-nav">
        <a href="/">Shop</a>
        <a href="/cart.html">
          Cart
          <span class="cart-badge" id="cart-count" hidden>0</span>
        </a>
        <a href="/staff.html">Staff</a>
      </nav>
    </div>
  </header>

  <main class="container container--narrow">
    <!-- order.js writes everything below. The page starts almost
         empty because we cannot know whether this order was paid or
         failed until we have asked the server. -->
    <div id="order-page">
      <p class="muted">Loading your order…</p>
    </div>
  </main>

  <footer class="site-footer">
    Watch Store Lab — a practice project. Nothing here is for sale, and no real money moves.
  </footer>

  <script src="js/cart-storage.js"></script>
  <script src="js/order.js"></script>
</body>
</html>
